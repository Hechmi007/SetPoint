<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 524" role="img" aria-label="Aperçu du compteur de score">
  <!-- Body: outer plate with the four slots cut out (evenodd) -->
  <g data-part="body">
    <path fill-rule="evenodd" stroke="rgba(0,0,0,.28)" stroke-width="1.5" d="
      M36,12 H132 Q156,12 156,36 V236 C156,252 146,254 146,264 C146,274 156,276 156,292 V488 Q156,512 132,512 H36 Q12,512 12,488 V292 C12,276 22,274 22,264 C22,254 12,252 12,236 V36 Q12,12 36,12 Z
      M30,56 a4,4 0 0 1 8,0 V224 a4,4 0 0 1 -8,0 Z
      M130,56 a4,4 0 0 1 8,0 V224 a4,4 0 0 1 -8,0 Z
      M30,300 a4,4 0 0 1 8,0 V488 a4,4 0 0 1 -8,0 Z
      M130,300 a4,4 0 0 1 8,0 V488 a4,4 0 0 1 -8,0 Z"/>
    <!-- lanyard hole -->
    <circle cx="118" cy="496" r="3.2" fill="rgba(0,0,0,.45)"/>
  </g>

  <!-- Writing: raised numbers and labels -->
  <g data-part="writing" font-family="'Comic Sans MS','Chalkboard SE','Segoe Print',system-ui,sans-serif" font-weight="700" text-anchor="middle" stroke="rgba(0,0,0,.22)" stroke-width=".8" paint-order="stroke">
    <text x="84" y="44" font-size="25">Points</text>
    <text x="84" y="82" font-size="32">0</text>
    <text x="84" y="118" font-size="32">15</text>
    <text x="84" y="154" font-size="32">30</text>
    <text x="84" y="190" font-size="32">40</text>
    <text x="84" y="226" font-size="32">AD</text>
    <text x="84" y="268" font-size="25">Games</text>
    <text x="84" y="306" font-size="27">0</text>
    <text x="84" y="334" font-size="27">1</text>
    <text x="84" y="362" font-size="27">2</text>
    <text x="84" y="390" font-size="27">3</text>
    <text x="84" y="418" font-size="27">4</text>
    <text x="84" y="446" font-size="27">5</text>
    <text x="84" y="474" font-size="27">6</text>
    <text x="84" y="502" font-size="27">7</text>
  </g>

  <!-- Right sliders -->
  <g data-part="pinsRight" stroke="rgba(0,0,0,.3)" stroke-width="1.3">
    <path d="M134,168 H158 Q164,168 164,174 V190 Q164,196 158,196 H134 L124,182 Z"/>
    <path d="M134,396 H158 Q164,396 164,402 V418 Q164,424 158,424 H134 L124,410 Z"/>
  </g>

  <!-- Left sliders: same shape as the right ones, mirrored (point facing the numbers) -->
  <g data-part="pinsLeft" stroke="rgba(0,0,0,.3)" stroke-width="1.3">
    <path d="M34,55 H10 Q4,55 4,61 V77 Q4,83 10,83 H34 L44,69 Z"/>
    <path d="M34,463 H10 Q4,463 4,469 V485 Q4,491 10,491 H34 L44,477 Z"/>
  </g>
</svg>
